# Single source of truth for thresholds and paths.
# Every key is required; relative paths are resolved against this file's folder.

camera:
  index: 0
  width: 640
  height: 480
  mirror: true

tracker:
  model_variant: full # lite | full | heavy
  model_dir: models
  num_poses: 1
  min_visibility: 0.5

hand_tracker:
  model_path: models/hand_landmarker.task
  num_hands: 2
  min_detection_confidence: 0.5 # finding a new hand; lower invites false hands
  min_presence_confidence: 0.3 # keeping a hand already found
  min_tracking_confidence: 0.3
  hold_frames: 3 # keep the last hands through losses this short

classifier:
  model_path: models/pose_clf.joblib
  confidence_threshold: 0.8

# RuleClassifier thresholds. Distances are in shoulder widths, as in features.py.
rules:
  mouth_radius: 0.4 # a hand point this close to the nose is at the mouth
  mouth_radius_without_fingers: 0.55 # undetected hand: pose points stop at the knuckles
  self_point_min_radius: 0.25 # fingertip closer to the nose than this is touching the mouth
  self_point_max_radius: 0.6 # fingertip farther than this isn't pointing at the face
  pointing_min_horizontal_ratio: 1.5 # a finger pointing at the face goes sideways, not up
  finger_extended_ratio: 1.1 # tip vs. middle joint distance from the wrist; measured 1.25+ straight, 0.82- curled
  open_hand_min_fingers: 4 # long fingers extended for a hand to count as open
  open_hand_min_spread: 2.0 # fingertips vs. knuckles width; measured 3.05 spread, 1.2-1.9 relaxed
  forward_hand_min_palm: 0.35 # wrist to palm center of a hand near the camera
  forward_hands_min_gap: 0.8 # between palm centers; hands pressed together stay at the mouth rule
  chest_half_width: 0.7
  chest_max_depth: 1.2 # how far below the shoulder line the chest goes
  hands_together_max_gap: 0.6 # between wrists; measured 0.30-0.42 with palms together, 1.0+ with one hand at the mouth
  head_min_height: 0.35 # top of the hand above the nose; measured 0.58 with hands on the head
  head_half_width: 0.8 # hand center to the nose, sideways; measured 0.5 with hands on the head
  tie_max_crossing: -0.1 # palm past the body center; measured -0.18 on the tie, -0.04 to 0.33 holding the other arm

stabilizer:
  window_size: 8 # frames
  min_ratio: 0.7 # share of the window a class needs for the pose to change

poses:
  neutral_class: neutro # never shows a meme, so it has no prompt
  prompts:
    mao_fechada_na_boca: "with curled fingers bunched against their mouth, as if eating"
    mao_aberta_na_boca: "holding an open hand in front of their mouth, showing their fingernails"
    maos_unidas: "with both palms pressed together in front of their face, as if praying"
    dedo_levantado: "raising one index finger in the air, making a point"
    apontando_para_si: "pointing a finger at their own face, asking who, me?"
    sinal_de_rock: "making the rock and roll devil horns hand sign"
    maos_abertas_para_frente: "reaching both open hands toward the camera with fingers spread wide"
    garras_para_frente: "reaching toward the camera with curled fingers like claws, screaming"
    mao_no_ombro: "with one hand across their body, holding their opposite shoulder or upper arm"
    dedo_na_boca: "thoughtfully touching their lips with one finger"
    maos_na_cabeca: "screaming with their mouth open and both hands on their head"
    mao_na_gravata: "smiling in a suit, adjusting their tie or lapel with one hand on their chest"

memes:
  dir: memes
  cache_dir: data/cache
  # Offline only (indexing), so its size never touches the frame loop. Of the 12 repo memes,
  # B-32 got 7 right and L-14 with the templates below 9 to 11: its misses lose by < 0.01,
  # small enough that batching the prompts differently flips them.
  clip_model: clip-ViT-L-14
  # Each class prompt fills the {} of every template; the class embedding is their mean.
  prompt_templates:
    - "a person {}"
    - "a photo of a person {}"
    - "a meme of a person {}"
    - "a close-up photo of someone {}"
  # Real memes scored 0.178-0.240 and images with no person 0.145-0.197: the ranges overlap,
  # so this only drops what scores below every real meme (noise, plain shapes).
  min_similarity: 0.16
  overrides: # meme file -> class, only where CLIP gets one wrong (see python -m scripts.index_memes)
    maria-joaquina-unha.webp: mao_aberta_na_boca # CLIP: dedo_na_boca
    ozzy-osbourne.jpg: garras_para_frente # CLIP: sinal_de_rock
    trajado.jpg: mao_na_gravata # CLIP: mao_no_ombro

renderer:
  panel_width_ratio: 0.5 # side panel (info on top, meme below), as a share of the camera width
  show_skeleton: true

data:
  samples_dir: data/samples
  reports_dir: reports

ui:
  window_title: meme-pose
  quit_key: q
  skeleton_key: s
  fps_window: 30 # frames averaged by the FPS counter
  timing_warmup_frames: 60 # left out of the per-stage times printed on exit
  max_window_width: 1600 # pixels; camera + panel shrink evenly to fit, never stretched

collect:
  samples_per_class: 200 # per session; recording stops by itself here
  sample_every: 2 # consecutive frames are nearly identical
  countdown_seconds: 3 # time to get into the pose, so the movement isn't labeled as the pose
  record_key: " "
  class_keys: "0123456789abc" # by position: the neutral class, then poses.prompts in order

training:
  hidden_layers: [64, 32]
  alpha: 0.001
  max_iter: 500
  knn_neighbors: 5
  random_seed: 42
  min_sessions: 2 # one to train on and another to test on
  max_class_f1_drop: 0.05 # scripts.compare_metrics rejects a model where an existing class lost more F1
